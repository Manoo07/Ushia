<?xml version="1.0" encoding="UTF-8"?>
<!-- Rea wallpaper, dark. Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160"
     width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"    stop-color="#131a2b"/>
      <stop offset="0.5"  stop-color="#0e1422"/>
      <stop offset="1"    stop-color="#080b14"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.22" cy="0.2" r="0.75">
      <stop offset="0"   stop-color="#2f6bff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#5b3fd4" stop-opacity="0.26"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.85" cy="0.88" r="0.7">
      <stop offset="0"   stop-color="#ff6a8b" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ff9f6a" stop-opacity="0.14"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#base)"/>
  <rect width="3840" height="2160" fill="url(#aurora)"/>
  <rect width="3840" height="2160" fill="url(#ember)"/>
  <rect width="3840" height="2160" fill="url(#vignette)"/>
</svg>
