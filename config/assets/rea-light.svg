<?xml version="1.0" encoding="UTF-8"?>
<!-- Rea wallpaper, light. Original artwork: overlapping radial gradients over
     a cool linear base. No third-party assets. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160"
     width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"    stop-color="#eaf1fb"/>
      <stop offset="0.55" stop-color="#dfe8f6"/>
      <stop offset="1"    stop-color="#cfdcf0"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.78" cy="0.18" r="0.72">
      <stop offset="0"   stop-color="#ffd9c0" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffc9d8" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.16" cy="0.84" r="0.78">
      <stop offset="0"   stop-color="#8fc2ff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#b8a8ff" stop-opacity="0.30"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lift" cx="0.5" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#base)"/>
  <rect width="3840" height="2160" fill="url(#cool)"/>
  <rect width="3840" height="2160" fill="url(#warm)"/>
  <rect width="3840" height="2160" fill="url(#lift)"/>
</svg>
