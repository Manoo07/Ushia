# manifest.conf - every external source Rea downloads, pinned to a reviewable
# reference. Nothing here is an Apple asset; licenses are noted per entry.
#
# Override any value from the environment, e.g.
#   REA_WHITESUR_REF=master rea install

# --- GTK + GNOME Shell theme (GPL-3.0) --------------------------------------
: "${REA_WHITESUR_REPO:=https://github.com/vinceliuice/WhiteSur-gtk-theme.git}"
: "${REA_WHITESUR_REF:=2026-09-10}"

# --- Icon theme (GPL-3.0) ---------------------------------------------------
: "${REA_WHITESUR_ICONS_REPO:=https://github.com/vinceliuice/WhiteSur-icon-theme.git}"
: "${REA_WHITESUR_ICONS_REF:=2026-09-10}"

# --- Cursor theme (GPL-3.0). Upstream publishes no tags, so this tracks the
# --- default branch and the checkout is validated before use. ---------------
: "${REA_CURSORS_REPO:=https://github.com/vinceliuice/McMojave-cursors.git}"
: "${REA_CURSORS_REF:=master}"

# --- Fonts. Interface font: Inter (SIL OFL 1.1), a metric-compatible stand-in
# --- for SF Pro, which may not be redistributed. Mono: JetBrains Mono (OFL).
: "${REA_INTER_URL:=https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip}"
: "${REA_INTER_VERSION:=4.1}"
: "${REA_JBMONO_URL:=https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip}"
: "${REA_JBMONO_VERSION:=2.304}"

# --- GNOME Shell extensions, fetched from extensions.gnome.org for the
# --- running shell version (the site serves the matching release itself).
REA_EXT_DOCK_ANIMATED="dash2dock-lite@icedman.github.com"   # magnifying dock
REA_EXT_DOCK_CLASSIC="dash-to-dock@micxgx.gmail.com"        # stable fallback
REA_EXT_BLUR="blur-my-shell@aunetx"
REA_EXT_PERFECTION="just-perfection-desktop@just-perfection"
REA_EXT_CORNERS="rounded-window-corners@fxgn"
REA_EXT_TILING="tiling-assistant@leleat-on-github"
REA_EXT_USER_THEME="user-theme@gnome-shell-extensions.gcampax.github.com"

# Extensions Rea disables because they fight the ones above.
REA_EXT_CONFLICTS=(
  "ubuntu-dock@ubuntu.com"
  "dash-to-panel@jderose9.github.com"
  "ding@rastersoft.com"
)
