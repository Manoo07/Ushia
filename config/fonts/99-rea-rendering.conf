<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- rea:managed - font rendering and Apple-name aliasing.
     Remove this file, or run `rea rollback`, to revert. -->
<fontconfig>

  <!-- Rendering: slight hinting + subpixel, which is the closest match to
       macOS's lightly-hinted, slightly heavier text. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Keep synthetic emboldening off: it is what makes faked bold text on
       Linux look muddier than the same weight on macOS. -->
  <match target="font">
    <edit name="embolden" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Apple font names, as requested by Electron apps, web apps and imported
       CSS, resolve to the installed open stand-ins. -->
  <alias binding="same"><family>-apple-system</family>
    <prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family>
    <prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>system-ui</family>
    <prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro</family>
    <prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family>
    <prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family>
    <prefer><family>Inter Display</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family>
    <prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family>
    <prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Menlo</family>
    <prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Monaco</family>
    <prefer><family>JetBrains Mono</family></prefer></alias>

  <!-- Generic families follow the same choices. -->
  <alias><family>sans-serif</family>
    <prefer><family>Inter</family><family>Cantarell</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Ubuntu Mono</family><family>DejaVu Sans Mono</family></prefer></alias>

</fontconfig>
