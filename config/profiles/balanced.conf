# balanced - the default. Everything that reads as macOS, nothing that costs a
# visible amount of battery or frame time. Recommended on integrated graphics.
REA_PROFILE_NAME="balanced"
REA_PROFILE_DESC="Default. macOS look and behaviour, panel-only blur, restrained animation."

REA_DOCK_FLAVOUR="animated"
REA_DOCK_ICON_SIZE=44
REA_DOCK_MAGNIFY=1
REA_DOCK_AUTOHIDE=1
REA_DOCK_OPACITY=0.4

REA_BLUR=1
REA_BLUR_SIGMA=20
REA_BLUR_PANEL_ONLY=1           # static panel blur only: no per-frame cost
REA_ROUNDED_CORNERS=1
REA_TILING=1

REA_ANIMATIONS=1
REA_ANIMATION_SPEED=3
REA_PANEL_SIZE=28

REA_FONT_UI="Inter 11"
REA_FONT_UI_FALLBACK="Inter 11"
REA_FONT_MONO="JetBrains Mono 11"
REA_FONT_HINTING="slight"
REA_FONT_ANTIALIAS="rgba"

REA_SPACES_CTRL_ARROWS=0
REA_CMD_SPACE_SEARCH=1
REA_NATURAL_SCROLL=1
REA_ATTACH_MODAL_DIALOGS=1
