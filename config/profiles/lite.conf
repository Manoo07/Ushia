# lite - looks macOS, costs almost nothing. For older machines, VMs, battery
# life, or anyone who finds desktop animation distracting.
REA_PROFILE_NAME="lite"
REA_PROFILE_DESC="Theme, icons and typography only. No blur, no extra compositing, minimal animation."

REA_DOCK_FLAVOUR="classic"
REA_DOCK_ICON_SIZE=40
REA_DOCK_MAGNIFY=0
REA_DOCK_AUTOHIDE=1
REA_DOCK_OPACITY=0.6

REA_BLUR=0
REA_BLUR_SIGMA=0
REA_ROUNDED_CORNERS=0
REA_TILING=1

REA_ANIMATIONS=1
REA_ANIMATION_SPEED=4
REA_PANEL_SIZE=26

REA_FONT_UI="Inter 11"
REA_FONT_UI_FALLBACK="Inter 11"
REA_FONT_MONO="JetBrains Mono 11"
REA_FONT_HINTING="slight"
REA_FONT_ANTIALIAS="rgba"

REA_SPACES_CTRL_ARROWS=0
REA_CMD_SPACE_SEARCH=1
REA_NATURAL_SCROLL=1
REA_ATTACH_MODAL_DIALOGS=0
