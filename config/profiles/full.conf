# full - the closest reproduction. Assumes a GPU that can blur a full screen.
REA_PROFILE_NAME="full"
REA_PROFILE_DESC="Closest to macOS. Blur, magnifying dock, rounded corners, full animation."

REA_DOCK_FLAVOUR="animated"     # animated | classic | none
REA_DOCK_ICON_SIZE=48
REA_DOCK_MAGNIFY=1
REA_DOCK_AUTOHIDE=1
REA_DOCK_OPACITY=0.35

REA_BLUR=1                      # Blur my Shell: panel + overview + dock
REA_BLUR_SIGMA=30
REA_ROUNDED_CORNERS=1
REA_TILING=1

REA_ANIMATIONS=1
REA_ANIMATION_SPEED=2           # Just Perfection scale: 1 slow .. 4 fastest
REA_PANEL_SIZE=28

REA_FONT_UI="Inter Display 11"
REA_FONT_UI_FALLBACK="Inter 11"
REA_FONT_MONO="JetBrains Mono 11"
REA_FONT_HINTING="slight"
REA_FONT_ANTIALIAS="rgba"

REA_SPACES_CTRL_ARROWS=0        # 1 = authentic Ctrl+Arrow spaces (see docs)
REA_CMD_SPACE_SEARCH=1
REA_NATURAL_SCROLL=1
REA_ATTACH_MODAL_DIALOGS=1      # macOS-style sheets
